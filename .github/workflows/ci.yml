name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only PyTorch wheel (the default Linux wheel pulls in CUDA libraries)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: python -m pyflakes movement scripts tests bench/make_payloads.py

      # The real HAPT recordings, so the data and leakage tests run for real.
      # download_data.py verifies the zip's SHA-256.
      - uses: actions/cache@v4
        with:
          path: data/download
          key: hapt-${{ hashFiles('scripts/download_data.py') }}
      - name: Get the dataset
        run: python scripts/download_data.py

      # Deselected by marker, not skipped: "mps" needs an Apple GPU, "trained_model"
      # needs the trained artifacts, which are not in git.
      - name: Tests
        run: python -m pytest -m "not mps and not trained_model" -rA --junitxml=pytest.xml

      - name: Fail if any selected test was skipped
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          s = ET.parse("pytest.xml").getroot().find("testsuite")
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"ran {tests - skipped} tests, skipped {skipped}")
          raise SystemExit(1 if skipped else 0)
          PY
