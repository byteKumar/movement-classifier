[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movement-classifier"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["movement"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "mps: needs an Apple GPU (MPS); deselected on the Linux CI runner",
    "trained_model: needs artifacts/ from the training scripts (not in git); deselected on CI",
]
